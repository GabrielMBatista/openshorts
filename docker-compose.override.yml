# Override local (Gabriel): GPU no backend, CPU limitado, volumes em D:
# Rollback: apagar este arquivo + docker tag openshorts-backend:cpu-bak openshorts-backend
services:
  backend:
    build:
      context: .
      args:
        GPU: "1"
    deploy:
      resources:
        limits:
          cpus: "6.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    volumes:
      - hf-cache:/app/.cache/huggingface
      - D:\openshorts\output:/app/output

  renderer:
    volumes:
      - D:\openshorts\output:/output

volumes:
  hf-cache:
